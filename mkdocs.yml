site_name: Interoperability Wiki
site_url: https://www.echoes-eccch.eu/
theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - attr_list
  - toc:
      permalink: true
      permalink_title: "Link to this section"

extra_css:
  - stylesheets/extra.css

# Publish downloadable evidence files without adding them to the site navigation.
not_in_nav: |
  /engineering-handbook/Validation/examples/assets/
